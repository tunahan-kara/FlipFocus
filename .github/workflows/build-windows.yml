name: Build Windows

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Generate Windows icon
        run: python assets/create_icon.py

      - name: Syntax and import checks
        run: |
          python -m py_compile main.py assets/create_icon.py
          python -c "import main; assert main.APP_VERSION == '1.0.0'"

      - name: Build executable
        run: pyinstaller --noconfirm --clean --windowed --onefile --name FlipFocus --icon assets/flipfocus.ico --version-file version_info.txt main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlipFocus-Windows
          path: dist/FlipFocus.exe
          if-no-files-found: error

      - name: Create GitHub release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "dist/FlipFocus.exe" --generate-notes --title "FlipFocus ${{ github.ref_name }}"
